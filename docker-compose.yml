# Local development: PostgreSQL + an S3-compatible store (SeaweedFS).
# Run the app on the host with `npm run dev`, or the production image with `--profile app`.
# All credentials come from .env (copy .env.example); none are committed.

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev-only S3 emulator. Production uses an EU-region S3 provider (see .env.example).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30

  # Creates the media bucket once SeaweedFS is up (idempotent).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:?set in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=seaweedfs:9333
    restart: 'no'

  # Optional: the production image against the local services (`docker compose --profile app up`).
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  s3data:
