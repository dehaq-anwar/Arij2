name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Actions are pinned to commit SHAs (tag in the comment), like every other dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Lint (ESLint, logical CSS, colour contrast)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Every dependency is at least 14 days old
        run: npm run check:deps
      - name: No unreviewed security advisories
        run: npm run check:audit
