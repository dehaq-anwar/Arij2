name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Throwaway database for the end-to-end tests (rebuilt by scripts/e2e-server.mjs); reachable
    # only from this job, so its password is not a secret.
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: yop
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: yop_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yop -d yop_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://yop:ci-only@localhost:5432/yop_e2e
      # Media storage is not used by the tests (no uploads).
      S3_BUCKET: e2e-unused
      S3_REGION: eu-central-1
    steps:
      # Actions are pinned to commit SHAs (tag in the comment), like every other dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Lint (ESLint, logical CSS, colour contrast)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Browser version is pinned by @playwright/test in package-lock.json.
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Random Payload secret for this run
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: End-to-end tests (CMS content, i18n, RTL, navigation, privacy, motion, axe)
        run: npm run test:e2e
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - name: Every dependency is at least 14 days old
        run: npm run check:deps
      - name: No unreviewed security advisories
        run: npm run check:audit
