name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Throwaway database for the end-to-end tests (rebuilt by scripts/e2e-server.mjs); reachable
    # only from this job, so its password is not a secret.
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: yop
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: yop_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yop -d yop_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://yop:ci-only@localhost:5432/yop_e2e
    steps:
      # Actions are pinned to commit SHAs (tag in the comment), like every other dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Lint (ESLint, logical CSS, colour contrast)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Browser version is pinned by @playwright/test in package-lock.json.
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Random Payload secret for this run
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # The operations agent's image: the backup and restore drill test runs it for real.
      - name: Build the operations agent image
        run: docker build -t yop-ops-agent:test ops-agent
      # The production compose file with the example settings, and the pinned Caddy and socket
      # proxy images its tests run (tests/integration/caddy.test.ts, socket-proxy.test.ts).
      - name: Production configuration
        run: |
          check="$(mktemp -d)"
          cp -r docker-compose.prod.yml docker ops-agent "$check"/
          cp .env.example "$check/.env"
          (cd "$check" && ACME_EMAIL=ci@example.org SITE_HOST=example.org \
            ADMIN_HOST=admin.example.org ADMIN_GATE_SECRET=ci POSTGRES_PASSWORD=ci \
            OPS_AGENT_SECRET=ci PAYLOAD_SECRET=ci docker compose -f docker-compose.prod.yml config --quiet)
          for image in $(sed -nE 's/^ *image: ((caddy|tecnativa\/docker-socket-proxy):[^ ]+)$/\1/p' docker-compose.prod.yml); do
            docker pull --quiet "$image"
          done
      - name: Integration tests (migrations, data transfers, backup and restore drill, proxies)
        run: npm run test:integration
      - name: End-to-end tests (CMS content, i18n, RTL, navigation, privacy, motion, axe)
        run: npm run test:e2e
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - name: Every dependency is at least 14 days old
        run: npm run check:deps
      - name: No unreviewed security advisories
        run: npm run check:audit

  # The production images as a server would build and run them (docs/OPERATIONS.md §3): the app
  # with the production compose file (read-only file system, migrations at start), the hosts and
  # the admin gate, then the first account through the tools service, the only way to create it.
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Settings for this run
        run: |
          cp .env.example .env
          {
            echo SITE_HOST=example.org
            echo ADMIN_HOST=admin.example.org
            echo ACME_EMAIL=ci@example.org
            echo "ADMIN_GATE_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "OPS_AGENT_SECRET=$(openssl rand -hex 32)"
            echo "PAYLOAD_SECRET=$(openssl rand -hex 32)"
          } >> .env
      - name: Build and start the app with an empty database
        run: |
          docker compose -p ci -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300 \
            postgres app
      - name: Website host, Control Center host, admin gate, cache directory
        run: |
          gate="$(grep '^ADMIN_GATE_SECRET=' .env | tail -1 | cut -d= -f2-)"
          docker compose -p ci -f docker-compose.prod.yml exec -T \
            -e SITE_HOST=example.org -e ADMIN_HOST=admin.example.org -e ADMIN_GATE_SECRET="$gate" \
            app node --input-type=module - < scripts/ci/production-smoke.mjs
      - name: First super administrator through the tools service
        run: |
          compose="docker compose -p ci -f docker-compose.prod.yml --profile tools"
          password="$(openssl rand -hex 16)"
          $compose run --rm -e ADMIN_PASSWORD="$password" tools \
            npm run create-admin -- first-admin@example.test "First Admin"
          role="$($compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select role from users"')"
          test "$role" = superAdmin
          # A second account with the same address is refused.
          if $compose run --rm -e ADMIN_PASSWORD="$password" tools \
            npm run create-admin -- first-admin@example.test "Again"; then exit 1; fi
          # The launch gate on the content runs the same way (here: lists, does not fail).
          $compose run --rm tools npm run check:content
      - name: App log when something failed
        if: failure()
        run: docker compose -p ci -f docker-compose.prod.yml logs app | tail -100
      - name: Remove the containers and the test database
        if: always()
        run: docker compose -p ci -f docker-compose.prod.yml --profile tools down -v
